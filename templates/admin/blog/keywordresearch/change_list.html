{% extends "admin/change_list.html" %}
{% block object-tools-items %}
  <li>
    <button
      onclick="document.getElementById('kw-research-modal').style.display='flex'"
      style="background:#16a34a;color:#fff;padding:6px 14px;border:none;border-radius:4px;font-size:13px;font-weight:bold;cursor:pointer;">
      🔍 Start Keyword Research
    </button>
  </li>
  {{ block.super }}
{% endblock %}

{% block content %}
{{ block.super }}

<!-- Modal -->
<div id="kw-research-modal"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:8px;padding:32px;width:420px;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
    <h2 style="margin:0 0 16px;font-size:18px;">🔍 Start Keyword Research</h2>
    <form method="post" action="{{ keyword_research_url }}">
      {% csrf_token %}
      <div style="margin-bottom:16px;">
        <label style="display:block;font-weight:bold;margin-bottom:6px;">Seed Keyword</label>
        <input type="text" name="seed_keyword" placeholder="e.g. income tax calculator india"
               required autofocus
               style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:4px;font-size:14px;box-sizing:border-box;">
        <small style="color:#6b7280;">AI will expand this into 20+ long-tail keywords.</small>
      </div>
      <div style="margin-bottom:24px;">
        <label style="display:block;font-weight:bold;margin-bottom:6px;">Market</label>
        <select name="market" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:4px;font-size:14px;">
          <option value="india">🇮🇳 India</option>
          <option value="us">🇺🇸 United States</option>
        </select>
      </div>
      <div style="display:flex;gap:12px;justify-content:flex-end;">
        <button type="button"
                onclick="document.getElementById('kw-research-modal').style.display='none'"
                style="padding:8px 18px;border:1px solid #d1d5db;border-radius:4px;background:#f9fafb;cursor:pointer;">
          Cancel
        </button>
        <button type="submit"
                style="padding:8px 18px;background:#16a34a;color:#fff;border:none;border-radius:4px;font-weight:bold;cursor:pointer;">
          🚀 Run Research
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
